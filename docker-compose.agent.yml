# ================================================================
# jarsWAF — Agent-Only Deployment (No ClickHouse, No Dashboard)
# ================================================================
# For small VPS (1 Core, 2GB RAM)
# RAM usage: ~30MB total
#
# Usage:
#   docker compose -f docker-compose.agent.yml up -d --build
# ================================================================

services:
  jarswaf-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: jarswaf_agent
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The agent runs non-root (Dockerfile.agent USER jarswaf); binding 80/443 needs
    # NET_BIND_SERVICE. TLS certs are generated into ./certs at runtime — mount stays rw.
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./config.standalone.toml:/app/config.toml
      - ./certs:/app/certs
      - jarswaf_logs:/var/log/jarswaf
    environment:
      - RUST_LOG=info
    # No ClickHouse dependency — zero overhead

volumes:
  jarswaf_logs:
