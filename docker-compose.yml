services:
  jarswaf-controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarswaf_controller
    command: ["/app/jarswaf", "controller"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      # The controller binds loopback by default (hardening); inside a container that would
      # make it unreachable from the host, so compose exposes it explicitly for the DAST/ZAP
      # scan. In production you'd front it with a reverse proxy instead.
      - JARSWAF_BIND=0.0.0.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # if the controller ever binds <1024; 8080 needs none
      # The entrypoint is root ONLY to chown mounted volumes, then drops privileges via
      # `setpriv` — which needs SETGID+SETUID, and the chown needs CHOWN. Without these
      # (cap_drop: ALL) startup fails: "su: cannot set groups" / "chown: Operation not
      # permitted", leaving the volume root-owned so the non-root server can't open SQLite.
      - SETGID
      - SETUID
      - CHOWN
    volumes:
      # config.toml is intentionally read-write: the controller persists generated
      # credentials/config on first boot (ensure_admin_credentials). Logs use a named
      # volume so the non-root `jarswaf` user can write without a root-owned host bind.
      - ./config.toml:/app/config.toml
      - jarswaf-logs:/var/log/jarswaf

volumes:
  jarswaf-logs:
