name: Release Precompiled Binary

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl

      - name: Install Rust (Nightly for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Configure Rust Defaults & Targets
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-musl --toolchain stable

      - name: Install dependencies & bpf-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential musl-tools
          cargo install bpf-linker

      - name: Build eBPF Program
        run: cargo +nightly run --package xtask

      - name: Build Release Binaries (glibc)
        run: |
          cargo +stable build --release --workspace
          mkdir -p dist
          cp target/release/jarswaf dist/jarswaf-linux-amd64
          cp target/release/agent dist/jarswaf-agent-linux-amd64
          cp target/release/controller dist/jarswaf-controller-linux-amd64

      - name: Build MUSL Static Binary
        run: |
          cargo +stable build --release --target x86_64-unknown-linux-musl --workspace
          cp target/x86_64-unknown-linux-musl/release/jarswaf dist/jarswaf-linux-amd64-musl
          cp target/x86_64-unknown-linux-musl/release/agent dist/jarswaf-agent-linux-amd64-musl
          cp target/x86_64-unknown-linux-musl/release/controller dist/jarswaf-controller-linux-amd64-musl
          
          # Create standardized tarball for musl (containing jarswaf, agent, controller)
          mkdir -p dist/musl-pkg
          cp target/x86_64-unknown-linux-musl/release/jarswaf dist/musl-pkg/jarswaf
          cp target/x86_64-unknown-linux-musl/release/agent dist/musl-pkg/agent
          cp target/x86_64-unknown-linux-musl/release/controller dist/musl-pkg/controller
          tar -czf jarswaf-${GITHUB_REF_NAME#v}-musl.tar.gz -C dist/musl-pkg jarswaf agent controller
          tar -czf jarswaf-latest-musl.tar.gz -C dist/musl-pkg jarswaf agent controller

          if [ -f "jarswaf-ebpf/target/bpfel-unknown-none/release/jarswaf-ebpf" ]; then
            cp jarswaf-ebpf/target/bpfel-unknown-none/release/jarswaf-ebpf dist/jarswaf-ebpf
          fi

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jarswaf-linux-amd64
            dist/jarswaf-agent-linux-amd64
            dist/jarswaf-controller-linux-amd64
            dist/jarswaf-linux-amd64-musl
            dist/jarswaf-agent-linux-amd64-musl
            dist/jarswaf-controller-linux-amd64-musl
            dist/jarswaf-ebpf
            jarswaf-*-musl.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
