name: Release Precompiled Binary

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl

      - name: Install Rust (Nightly for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install dependencies & bpf-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential musl-tools
          cargo install bpf-linker

      - name: Build eBPF Program
        run: cargo +nightly run --package xtask

      - name: Build Release Binaries (glibc)
        run: cargo build --release --workspace

      - name: Build MUSL Static Binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/release/jarswaf dist/jarswaf-linux-amd64
          cp target/release/agent dist/jarswaf-agent-linux-amd64
          cp target/release/controller dist/jarswaf-controller-linux-amd64
          cp target/x86_64-unknown-linux-musl/release/jarswaf dist/jarswaf-linux-amd64-musl
          cp target/x86_64-unknown-linux-musl/release/agent dist/jarswaf-agent-linux-amd64-musl
          cp target/x86_64-unknown-linux-musl/release/controller dist/jarswaf-controller-linux-amd64-musl
          tar -czf dist/jarswaf-linux-amd64.tar.gz -C dist jarswaf-linux-amd64 agent controller
          tar -czf jarswaf-${GITHUB_REF_NAME#v}-musl.tar.gz -C dist jarswaf-linux-amd64-musl jarswaf-agent-linux-amd64-musl jarswaf-controller-linux-amd64-musl
          cp jarswaf-ebpf/target/bpfel-unknown-none/release/jarswaf-ebpf dist/jarswaf-ebpf

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jarswaf-linux-amd64
            dist/jarswaf-agent-linux-amd64
            dist/jarswaf-controller-linux-amd64
            dist/jarswaf-linux-amd64-musl
            dist/jarswaf-agent-linux-amd64-musl
            dist/jarswaf-controller-linux-amd64-musl
            dist/jarswaf-ebpf
            jarswaf-*-musl.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
