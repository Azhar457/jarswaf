name: DevSecOps CI (SAST & DAST)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'dashboard/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'xtask/**'
      - '.github/workflows/devsecops.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'dashboard/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'xtask/**'
      - '.github/workflows/devsecops.yml'

# Least-privilege: default to read-only for the whole workflow; individual jobs that
# need more (codeql: security-events: write) declare it explicitly. Prevents the
# repo-default GITHUB_TOKEN (often contents: write on older repos) from leaking into
# unscoped steps of sast/dast jobs that run third-party actions.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: SAST - Static Code Analysis & Dependency Audits
  # -------------------------------------------------------------
  sast_audit:
    name: SAST & Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x.x

      # Setup Rust Environment
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.x.x

      # Check Rust Code Formatting
      - name: Run Cargo Fmt
        run: cargo fmt --all -- --check

      # Static Analysis for Rust
      - name: Run Clippy (Rust SAST)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Security Audit for Rust crates
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run Cargo Audit (Rust Vulnerability Scan)
        run: cargo audit

      # Setup Node.js Environment (Dashboard)
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x.x
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      # Install Frontend Dependencies
      - name: Install Dashboard Dependencies
        run: npm ci --prefix dashboard

      # Svelte TypeScript Type-Checking
      - name: Run Svelte Check
        run: npm run check --prefix dashboard

      # Audit NPM Dependencies for Vulnerabilities
      - name: Run NPM Audit (Frontend Vulnerability Scan)
        run: npm audit --prefix dashboard

  # -------------------------------------------------------------
  # Job 2: CodeQL - GitHub Advanced Security Scan
  # -------------------------------------------------------------
  codeql_analysis:
    name: GitHub CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x.x

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@eb3cef721752a3421fe144a742539281bdf4df1a # v3.x.x
        with:
          languages: javascript, typescript, rust

      # Autobuild Rust and Frontend
      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@eb3cef721752a3421fe144a742539281bdf4df1a # v3.x.x

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@eb3cef721752a3421fe144a742539281bdf4df1a # v3.x.x

  # -------------------------------------------------------------
  # Job 3: DAST - Dynamic Application Security Testing (OWASP ZAP)
  # -------------------------------------------------------------
  dast_zap_scan:
    name: DAST (OWASP ZAP Scan)
    runs-on: ubuntu-latest
    needs: [sast_audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x.x

      # Spin up WAF and Dashboard via Docker Compose for testing
      - name: Spin up Docker Services
        run: |
          # Validate the docker + compose V2 setup up front (a missing plugin/daemon fails
          # later with a confusing "docker-compose: command not found").
          docker info >/dev/null 2>&1 || { echo "docker daemon not ready"; exit 1; }
          docker compose version || { echo "docker compose (V2) plugin missing"; exit 1; }
          docker compose up -d --build
          # Wait for services to be fully healthy and listening on port 8080
          sleep 15

      # Run OWASP ZAP Baseline scan against jarsWAF Controller/Dashboard
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@4dbc7854a9ad12686198001f786c09768ab9f9ac # v0.13.0
        with:
          target: 'http://localhost:8080/'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false # Report findings without breaking builds immediately

