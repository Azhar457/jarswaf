# jarsWAF Red Team Lab — dedicated pentest config
# TLS disabled, minimal noise, backend echo on 8080
# 127.0.0.1 allowlisted (lab localhost), BOT-001 curl-rule noted as false-positive

allowlists = [{ name = "lab-localhost", ips = ["127.0.0.1", "::1"], paths = ["/*"], enabled = true }]
blacklists = []

[global]
port_http = 8000
port_https = 8443
max_body_size = 10485760
default_rate_limit = 600
log_dir = "./logs"
log_level = "verbose"
admin_token = "6476d3eb0e7043f7b72272c308fce8bc"
waf_enabled = true
webhooks = []
metrics_push_interval_secs = 60

[tls]
mode = "disabled"
cert_dir = "./certs"

[logging]
mode = "sqlite"
log_path = "./logs/redteam.log"
max_log_size_mb = 50
max_log_files = 5
push_interval_secs = 300
push_batch_size = 100
blocklist_path = "./blocklist.json"
db_path = "/tmp/jarswaf-redteam.db"

[components]
dashboard = false
clickhouse = false
service_discovery = false
geoip = false

[[rate_limit_policies]]
name = "Default API/Website Traffic"
limit = "600 requests / minute"
burst = 100
path = "/*"
description = "Default threshold"

[[vhosts]]
name = "jarswaf-redteam"
hosts = ["test.jarswafwaf.demo", "127.0.0.1"]
backend = "127.0.0.1:8080"
tenant = "default"
rate_limit_tiers = []
rules = ["SQLI-*", "XSS-*", "LFI-*", "RFI-*", "SSRF-*", "CMDI-*", "BOT-*", "CANARY-*", "BHV-*", "IPREP-*", "SSTI-*", "XXE-*", "UPLOAD-*", "SMUGGLE-*", "REVSHELL-*", "WEBSHELL-*", "ANOMALY-*", "EVASION-*", "RATELIMIT-*", "CSRF-*"]
blocked_countries = []
geoblock_type = "Blocklist"
custom_rules = []
ssl = "Off"
max_body = "10MB"
rate_limit = "600 req/min"
is_default = false
allowlists = []
blacklists = []
max_conns_per_ip = 500
max_concurrent_requests = 500
bot_challenge_enabled = false
websocket_security_enabled = false

[vhosts.logging]
enabled = true
db_path = "/tmp/jarswaf-redteam.db"

[redis]
enabled = false
url = "redis://127.0.0.1:6379"
